name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Code Formatting Check
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static Analysis (Zero Warning Tolerance)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Execute Automated Unit & Widget Test Suite
        run: flutter test --coverage

      - name: Verify Coverage File Generation
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Coverage file generated successfully."
          else
            echo "Coverage file not generated."
            exit 1
          fi

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          if-no-files-found: warn
